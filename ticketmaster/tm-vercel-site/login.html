<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#026cdf"/>
  <title>Ticketmaster · Sign in</title>
  <link rel="icon" href="/favicon.ico?v=tm1" type="image/x-icon" sizes="any"/>
  <link rel="shortcut icon" href="/favicon.ico?v=tm1" type="image/x-icon"/>
  <link rel="preconnect" href="https://upload.wikimedia.org"/>
  <link rel="dns-prefetch" href="https://upload.wikimedia.org"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --tm-blue: #026cdf;
      --tm-blue-mid: #1a7fe0;
      --tm-blue-dark: #0153a3;
      --tm-blue-soft: rgba(2, 108, 223, 0.14);
      --tm-navy: #02121f;
      --tm-navy-panel: #061c2e;
      --tm-navy-deep: #010a12;
      --bg: #ffffff;
      --tm-retail-black: #121212;
      --tm-retail-bar: #000000;
      --tm-page-gray: #f6f7f8;
      --surface: #ffffff;
      --border: #c5ced8;
      --text: #121212;
      --muted: #5c6570;
      --accent: #026cdf;
      --accent2: #059669;
    }
    * { box-sizing: border-box; }
    body.tm-app-body {
      margin: 0;
      font-family: 'Sora', 'Inter', system-ui, sans-serif;
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
    }
    .topbar {
      padding: 0;
      background: var(--tm-blue);
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
    }
    .tm-util-bar {
      background: var(--tm-retail-bar);
      color: #fff;
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }
    .tm-util-nav {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.4rem 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.35rem 1rem;
    }
    .tm-util-nav a {
      color: rgba(255, 255, 255, 0.92);
      text-decoration: none;
      white-space: nowrap;
    }
    .tm-util-nav a:hover { text-decoration: underline; color: #fff; }
    .tm-main-nav {
      background: var(--tm-blue);
      color: #fff;
      padding: 0 0 0.65rem;
    }
    .tm-main-nav-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.65rem 1rem 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem 0.75rem;
    }
    .tm-cat-nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 0.25rem 0.65rem;
      flex: 1 1 auto;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .tm-cat-nav a {
      color: #fff;
      text-decoration: none;
      white-space: nowrap;
      padding: 0.2rem 0;
    }
    .tm-cat-nav a:hover { text-decoration: underline; opacity: 0.95; }
    .tm-nav-user {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .tm-nav-user a {
      color: #fff;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .tm-nav-user a:hover { text-decoration: underline; }
    .tm-nav-user svg { flex-shrink: 0; opacity: 0.95; }
    .tm-context-line {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.35rem 1rem 0;
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.78);
      text-align: center;
    }
    .topbar--simple { box-shadow: 0 1px 0 rgba(0, 0, 0, 0.06); }
    .tm-simple-bar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.7rem 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem 1rem;
    }
    .tm-brand-lockup--simple { margin-bottom: 0; }
    .tm-simple-context {
      margin: 0;
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.88);
    }
    .tm-topbar-login-btn {
      margin: 0;
      padding: 0.4rem 1rem;
      font-size: 0.6875rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #026cdf;
      background: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
    }
    .tm-topbar-login-btn:hover { filter: brightness(0.97); }
    .tm-topbar-account-slot {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }
    #tm-topbar-guest[hidden],
    #tm-topbar-signed[hidden] {
      display: none !important;
    }
    .tm-account-wrap {
      position: relative;
    }
    .tm-topbar-account-trigger {
      margin: 0;
      padding: 0.35rem 0.65rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.6875rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
    }
    .tm-topbar-account-trigger:hover {
      background: rgba(255, 255, 255, 0.28);
    }
    .tm-account-ico {
      flex-shrink: 0;
      opacity: 0.95;
    }
    .tm-topbar-account-label {
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tm-account-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      min-width: 260px;
      max-width: min(320px, calc(100vw - 24px));
      padding: 0;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      box-shadow: 0 12px 40px rgba(2, 18, 31, 0.14), 0 2px 8px rgba(2, 18, 31, 0.06);
      z-index: 50;
      overflow: hidden;
    }
    .tm-account-menu-header {
      padding: 0.875rem 1rem 0.7rem;
      border-bottom: 1px solid #f1f5f9;
    }
    .tm-account-menu-email {
      margin: 0;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.45;
      word-break: break-word;
    }
    .tm-account-menu-body {
      padding: 0.25rem 0 0.15rem;
    }
    .tm-account-menu-item {
      display: flex;
      align-items: center;
      width: 100%;
      margin: 0;
      padding: 0.7rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      text-align: left;
      text-decoration: none;
      color: var(--tm-blue);
      background: transparent;
      border: none;
      cursor: pointer;
      font-family: inherit;
      box-sizing: border-box;
      transition: background-color 0.12s ease, color 0.12s ease;
    }
    .tm-account-menu-item:focus-visible {
      outline: 2px solid var(--tm-blue);
      outline-offset: -2px;
    }
    a.tm-account-menu-item:hover,
    a.tm-account-menu-item:focus-visible {
      background: rgba(2, 108, 223, 0.1);
      color: #0153a3;
    }
    .tm-account-menu-hint {
      margin: 0;
      padding: 0.3rem 1rem 0.65rem;
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.45;
    }
    .tm-account-menu-sep {
      height: 1px;
      margin: 0;
      background: #e8eaed;
    }
    .tm-account-menu-signout {
      color: #b91c1c !important;
      padding: 0.75rem 1rem;
    }
    .tm-account-menu-signout:focus-visible {
      outline-color: #b91c1c;
    }
    .tm-account-menu-signout:hover,
    .tm-account-menu-signout:focus-visible {
      background: rgba(185, 28, 28, 0.09);
      color: #991b1b !important;
    }
    .tm-viewer-empty-tickets {
      max-width: 720px;
      margin: 0 auto;
      padding: 0.5rem 1rem 1.25rem;
    }
    .tm-viewer-empty-tickets p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.45;
    }
    .tm-site-footer--simple {
      padding: 1.1rem 1rem 1.5rem;
      text-align: center;
      border-top: 1px solid #e8eaed;
    }
    .tm-site-footer--simple .tm-footer-legal {
      margin: 0;
      font-size: 0.8125rem;
      color: var(--muted);
    }
    .tm-site-footer--simple a {
      color: var(--tm-blue);
      font-weight: 700;
      text-decoration: none;
    }
    .tm-site-footer--simple a:hover { text-decoration: underline; }
    .tm-site-footer--simple .tm-footer-disclaimer {
      margin: 0 auto 0.6rem;
      max-width: 40rem;
      padding: 0 0.75rem;
      font-size: 0.6875rem;
      line-height: 1.45;
      color: #94a3b8;
      font-weight: 400;
    }
    body.tm-shell-ticket-minimal {
      background: #f4f4f4 !important;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    body.tm-shell-ticket-minimal main {
      max-width: 420px;
      margin: 0 auto;
      padding: 12px 14px 36px;
      background: transparent;
    }
    body.tm-shell-ticket-minimal .tm-pass-card {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .tm-topbar-inner {
      max-width: 430px;
      margin: 0 auto;
      padding: 0.85rem 1rem 0.95rem;
      text-align: center;
    }
    .tm-brand-lockup {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      margin-bottom: 0.35rem;
    }
    .tm-wordmark-img {
      display: block;
      height: 30px;
      width: auto;
      max-width: min(260px, 92vw);
      object-fit: contain;
      image-rendering: -webkit-optimize-contrast;
    }
    .tm-wordmark-img--light {
      filter: brightness(0) invert(1);
    }
    .tm-brand-lockup:hover .tm-wordmark-img {
      opacity: 0.88;
    }
    .tm-footer-wordmark {
      height: 24px;
      margin: 0 auto 0.35rem;
    }
    .tm-main-nav-inner .tm-brand-lockup { margin-bottom: 0; }
    .topbar--tm h1 { display: none; }
    .topbar p { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.9rem; }
    .tm-site-footer {
      margin-top: auto;
      padding: 1.75rem 1.25rem 2rem;
      text-align: center;
      font-size: 0.8125rem;
      color: var(--muted);
      background: var(--tm-page-gray);
      border-top: 1px solid #e8eaed;
    }
    .tm-site-footer-inner {
      max-width: 720px;
      margin: 0 auto;
    }
    .tm-footer-tagline {
      margin: 0 0 0.65rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tm-wordmark-img--footer {
      filter: none;
      height: 22px;
      width: auto;
    }
    .tm-site-footer a {
      color: var(--tm-blue);
      font-weight: 700;
      text-decoration: none;
    }
    .tm-site-footer a:hover { text-decoration: underline; color: var(--tm-blue-dark); }
    .tm-footer-legal { margin: 0; line-height: 1.55; }
    body.tm-page--home .demo-banner {
      max-width: 960px;
      margin-left: auto;
      margin-right: auto;
      margin-bottom: 0.5rem;
    }
    .demo-banner {
      margin: 0 1.5rem 0;
      padding: 0.65rem 1rem;
      background: rgba(255, 180, 80, 0.12);
      border: 1px solid rgba(255, 180, 80, 0.35);
      border-radius: 8px;
      color: #e8c48a;
      font-size: 0.88rem;
    }
    main {
      max-width: 430px;
      margin: 0 auto;
      padding: 1.25rem 1rem 2rem;
      position: relative;
      z-index: 1;
    }
    body.tm-page--home main {
      max-width: none;
      padding: 0;
      width: 100%;
    }
    .barcode-panel { background: transparent !important; border: none !important; box-shadow: none !important; }
    .tickets-only-panel { padding: 0 !important; }
    .acct.acct--tickets-only {
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      margin-bottom: 0;
      overflow: visible;
    }
    .acct {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 1.5rem;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    }
    .acct-hd {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      background: linear-gradient(105deg, rgba(79,140,255,0.08), transparent 40%);
    }
    .acct-hd-inner { flex: 1; min-width: 0; }
    .acct-hd h2 {
      margin: 0 0 0.35rem;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      word-break: break-word;
      color: var(--text);
    }
    .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.4rem; }
    .chip {
      font-size: 0.78rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: rgba(79, 140, 255, 0.2);
      color: #b8d0ff;
    }
    .chip.dim { background: rgba(46, 230, 166, 0.12); color: var(--accent2); }
    .credline { margin: 0 0 0.35rem; font-size: 0.82rem; }
    .header-full {
      margin: 0;
      font-size: 0.68rem;
      color: var(--muted);
      word-break: break-all;
      line-height: 1.35;
    }
    .mono { font-family: 'IBM Plex Mono', monospace; }
    .badge {
      flex-shrink: 0;
      background: var(--accent);
      color: #061018;
      font-weight: 700;
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border-bottom: 1px solid var(--border);
    }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
    .panel {
      padding: 1rem 1.25rem;
      border-right: 1px solid var(--border);
    }
    .panel:last-of-type { border-right: none; }
    .panel.full { border-right: none; border-top: 1px solid var(--border); }
    .panel h3 {
      margin: 0 0 0.65rem;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent2);
      font-weight: 600;
    }
    .evlist {
      margin: 0;
      padding-left: 1.1rem;
      color: var(--text);
      font-size: 0.88rem;
    }
    .evlist li { margin-bottom: 0.45rem; }
    .evlist.past { opacity: 0.85; }
    .muted { color: var(--muted); font-size: 0.88rem; margin: 0; }
    .cards {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.82rem;
      background: #0a0c10;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .tm-ticket-carousel {
      position: relative;
      max-width: 400px;
      margin: 0 auto 1.5rem;
    }
    .tm-carousel-viewport {
      overflow: hidden;
      width: 100%;
    }
    .tm-carousel-track {
      display: flex;
      transition: transform 0.38s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .tm-carousel-slide {
      flex: 0 0 100%;
      width: 100%;
      min-width: 0;
    }
    .tm-carousel-slide .tm-pass-card {
      margin: 0;
    }
    .tm-carousel-arrow {
      position: absolute;
      top: 42%;
      transform: translateY(-50%);
      z-index: 8;
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1.5px solid var(--tm-blue-soft);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.97);
      color: var(--tm-blue);
      font-size: 1.45rem;
      font-weight: 300;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 2px 14px rgba(2, 108, 223, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tm-carousel-arrow:hover {
      background: #fff;
      border-color: rgba(2, 108, 223, 0.35);
    }
    .tm-carousel-arrow:disabled {
      opacity: 0.28;
      cursor: default;
      pointer-events: none;
    }
    .tm-carousel-prev { left: 4px; }
    .tm-carousel-next { right: 4px; }
    .tm-ticket-carousel--single .tm-carousel-arrow,
    .tm-ticket-carousel--single .tm-carousel-dots {
      display: none;
    }
    .tm-carousel-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 12px;
    }
    .tm-carousel-dot {
      width: 7px;
      height: 7px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: #cbd5e1;
      cursor: pointer;
    }
    .tm-carousel-dot.is-active {
      background: var(--tm-blue);
      transform: scale(1.2);
    }
    .tm-pass-card {
      max-width: 400px;
      margin: 0 auto;
      background: #fff;
      color: #000;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.1), 0 2px 8px rgba(0, 0, 0, 0.06);
      border: 1px solid rgba(0, 0, 0, 0.06);
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    .tm-pass-rail {
      height: 3px;
      background: #026cdf;
      flex-shrink: 0;
    }
    .tm-pass-warn {
      font-size: 0.78rem;
      color: #9a3412;
      background: #fff7ed;
      padding: 8px 12px;
      margin: 0 12px 0;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #fed7aa;
    }
    .tm-pass-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px 12px;
      background: #fff;
      border-bottom: 1px solid #eee;
    }
    .tm-pass-menu {
      border: none;
      background: transparent;
      cursor: pointer;
      color: #000;
      width: 40px;
      height: 40px;
      padding: 0;
      margin: -4px 0 0 -6px;
      line-height: 1;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    a.tm-pass-menu { color: #000; }
    .tm-pass-menu:hover { background: rgba(2, 108, 223, 0.08); color: #026cdf; }
    .tm-pass-menu-ico { display: block; }
    .tm-pass-head-text { flex: 1; min-width: 0; padding-top: 2px; }
    .tm-pass-title {
      margin: 0;
      font-size: 0.9375rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.2;
      word-break: break-word;
      text-transform: uppercase;
      color: #000;
    }
    .tm-pass-sub {
      margin: 6px 0 0;
      font-size: 0.8125rem;
      font-weight: 400;
      color: #666;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tm-pass-visual { position: relative; }
    .tm-pass-hero {
      position: relative;
      height: 308px;
      min-height: 308px;
      max-height: 308px;
    }
    .tm-pass-hero-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
    }
    .tm-pass-hero--grad {
      background: linear-gradient(165deg, hsl(var(--tm-hue) 52% 34%) 0%, hsl(var(--tm-hue) 44% 14%) 100%);
      height: 308px;
      min-height: 308px;
      max-height: 308px;
    }
    .tm-pass-hero-shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.22) 55%, rgba(0,0,0,0.45) 100%);
      pointer-events: none;
      z-index: 1;
    }
    .tm-pass-bar-sheet {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 3;
      padding: 12px 12px 10px;
      background: #eceeef;
      border-radius: 10px;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.06), 0 4px 14px rgba(0, 0, 0, 0.12);
      border: 1px solid rgba(0, 0, 0, 0.05);
    }
    .tm-pass-screen-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 0.625rem;
      font-weight: 700;
      color: #000;
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }
    .tm-pass-phone-ico {
      flex-shrink: 0;
